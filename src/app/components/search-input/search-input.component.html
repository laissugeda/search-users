<div class="search-wrapper">
  <div class="input-group">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      placeholder="Pesquise um login do GitHub..."
      [(ngModel)]="inputValue"
      (keyup.enter)="emitSearch()"
    />
  </div>
  <button class="btn-search" (click)="emitSearch()">
    Buscar
  </button>
</div>
