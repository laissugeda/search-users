<form (submit)="emitSearch(); $event.preventDefault()" class="search-wrapper" role="search">
  <div class="input-group">
    <label for="github-search" class="sr-only">Nome de usuário do GitHub</label>
    
    <span class="search-icon" aria-hidden="true">🔍</span>
    
    <input
      id="github-search"
      type="search"
      placeholder="Pesquise um login do GitHub..."
      [(ngModel)]="inputValue"
      (search)="onClear($event)"
      name="searchQuery"
      aria-describedby="search-hint"
      autocomplete="off"
      spellcheck="false"
    />
  </div>

  <button 
    type="submit" 
    class="btn-search" 
    [attr.aria-label]="'Buscar usuário ' + inputValue"
  >
    Buscar
  </button>

  <span id="search-hint" class="sr-only">
    Digite o nome de usuário e pressione Enter para buscar perfis e repositórios.
  </span>
</form>
